<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>Snap Overlay</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    html, body { height: 100%; background: transparent; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

    #zones { position: relative; width: 100vw; height: 100vh; }

    .zone {
      position: absolute;
      border: 3px solid rgba(108, 92, 231, 0.9);
      background: rgba(108, 92, 231, 0.15);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.15s ease;
      animation: glowIn 0.3s ease;
    }

    .zone:hover, .zone.filled {
      background: rgba(108, 92, 231, 0.5);
      border-width: 4px;
      box-shadow: 0 0 20px rgba(108, 92, 231, 0.4);
    }

    .zone.done {
      background: rgba(16, 185, 129, 0.45);
      border-color: rgba(16, 185, 129, 0.9);
    }

    .zone-label {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      pointer-events: none;
      text-align: center;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .zone-number {
      min-width: 34px;
      height: 34px;
      padding: 0 8px;
      background: rgba(108, 92, 231, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      pointer-events: none;
    }

    .zone.done .zone-number {
      background: rgba(16, 185, 129, 0.95);
    }

    #header-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 15, 20, 0.92);
      border: 1px solid rgba(108, 92, 231, 0.5);
      border-radius: 10px;
      padding: 10px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    #header-bar h1 {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    #header-bar p {
      color: rgba(255,255,255,0.7);
      font-size: 12px;
    }

    #progress {
      color: #10b981;
      font-size: 14px;
      font-weight: 600;
    }

    #progress-text {
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      margin-top: 2px;
    }

    #finish-btn {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      z-index: 100;
      padding: 10px 26px;
      background: linear-gradient(135deg, #6c5ce7, #8b5cf6);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
      font-family: 'Segoe UI', sans-serif;
    }

    #finish-btn:hover { transform: translateX(-50%) translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,0.5); }

    .zone.hint-glow {
      animation: hint 0.8s infinite alternate;
      border-color: #fff;
    }

    @keyframes glowIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes hint {
      from { box-shadow: 0 0 0 rgba(255,255,255,0); }
      to { box-shadow: 0 0 30px rgba(255,255,255,0.6); }
    }
  </style>
</head>
<body>
  <div id="header-bar">
    <h1>Click a zone to snap your focused window</h1>
    <p>Alt+Tab to the window you want, then click its zone</p>
    <div id="progress"></div>
    <div id="progress-text"></div>
  </div>

  <div id="zones"></div>

  <button id="finish-btn">Done</button>

  <script src="overlay.js"></script>
</body>
</html>
